# cspell:ignore initdb,meili,mysqladmin,mysqld,wwwgroup,wwwuser
name: vltava
services:
    nginx:
        image: 'nginx:1.31.6'
        restart: unless-stopped
        ports:
            - '127.0.0.1:${HTTP_PORT:-8000}:80'
            - '${TRACKER_BIND_ADDRESS:-127.0.0.1}:${SSL_PORT:-443}:443'
        environment:
            - SSL_PORT=${SSL_PORT:-443}
            - SERVER_NAME=${SERVER_NAME:-localhost}
            - SSL_DOMAIN=${SSL_DOMAIN:-localhost}
            - SSL_ALT_NAME=${SSL_ALT_NAME:-DNS:localhost}
        volumes:
            - 'sail-nginx:/etc/nginx/certs'
            - './nginx/templates:/etc/nginx/templates'
            - './nginx/fastcgi-params.conf:/etc/nginx/vltava-fastcgi-params.conf:ro'
            - './vendor/ryoluo/sail-ssl/nginx/generate-ssl-cert.sh:/docker-entrypoint.d/99-generate-ssl-cert.sh'
            - './public:/var/www/html/public:ro'
        depends_on:
            - laravel.test
        networks:
            - sail
    sail-runtime:
        # Build-only reuse of Sail's extensions/tooling; never starts in the live stack.
        profiles: [build]
        build:
            context: ./vendor/laravel/sail/runtimes/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.4/app
    laravel.test:
        build:
            context: ./docker/php-fpm
            additional_contexts:
                # Build sail-runtime first via the build profile (see LOCAL_PRODUCTION.md).
                sail: 'docker-image://sail-8.4/app'
        image: sail-8.4/fpm
        restart: unless-stopped
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: 'off'
            # Sized from the isolated capacity benchmark (see
            # docker-compose.capacity.yml and README "Měření kapacity"), not
            # guessed: one announce costs ~41ms and one member roundtrip
            # ~152ms of PHP time, and the two pools are deliberately given the
            # same ceiling so a saturated member site cannot take the CPU the
            # announce path needs. Re-measure before widening either.
            WEB_FPM_MAX_CHILDREN: '${WEB_FPM_MAX_CHILDREN:-24}'
            WEB_FPM_START_SERVERS: '${WEB_FPM_START_SERVERS:-10}'
            WEB_FPM_MIN_SPARE_SERVERS: '${WEB_FPM_MIN_SPARE_SERVERS:-6}'
            WEB_FPM_MAX_SPARE_SERVERS: '${WEB_FPM_MAX_SPARE_SERVERS:-16}'
            TRACKER_FPM_MAX_CHILDREN: '${TRACKER_FPM_MAX_CHILDREN:-24}'
            TRACKER_FPM_START_SERVERS: '${TRACKER_FPM_START_SERVERS:-8}'
            TRACKER_FPM_MIN_SPARE_SERVERS: '${TRACKER_FPM_MIN_SPARE_SERVERS:-6}'
            TRACKER_FPM_MAX_SPARE_SERVERS: '${TRACKER_FPM_MAX_SPARE_SERVERS:-12}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - meilisearch
            - mysql
            - redis
    queue:
        image: sail-8.4/fpm
        restart: unless-stopped
        # Metadata/background jobs only; announce traffic no longer shares
        # this worker or queue (see `tracker-queue` below).
        command: php artisan queue:work redis --queue=default --sleep=1 --tries=3 --timeout=120
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - meilisearch
            - mysql
            - redis
    tracker-queue:
        image: sail-8.4/fpm
        restart: unless-stopped
        # Dedicated consumers for the `tracker` queue so announce-driven jobs
        # never queue behind metadata/background work on `default` (or vice
        # versa). Timeout stays comfortably under config/queue.php's redis
        # `retry_after` so a slow job is never picked up twice.
        #
        # `ProcessAnnounce` measured ~41ms per job under load and a worker is
        # single-threaded, so one worker tops out near 24 announces/s; six
        # cover the benchmark's 121/s with headroom for retries.
        deploy:
            replicas: 6
        command: php artisan queue:work redis --queue=tracker --sleep=1 --tries=3 --timeout=90
        # Bounded shutdown: let `queue:work` finish (or time out) whatever
        # job it's on before Compose sends SIGKILL.
        stop_signal: SIGTERM
        stop_grace_period: 100s
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - meilisearch
            - mysql
            - redis
    schedule:
        image: sail-8.4/fpm
        restart: unless-stopped
        command: php artisan schedule:work
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - meilisearch
            - mysql
            - redis
    reverb:
        image: sail-8.4/fpm
        restart: unless-stopped
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - redis
    mysql:
        image: 'mysql:8.4.11'
        restart: unless-stopped
        environment:
            # Root has its own credential and is reachable only from inside the container.
            MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD}'
            MYSQL_ROOT_HOST: 'localhost'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'sail-mysql-8-4:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-uroot'
                - '-p${DB_ROOT_PASSWORD}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:8.10.2-alpine'
        restart: unless-stopped
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:v1.31.3'
        restart: unless-stopped
        ports:
            - '127.0.0.1:${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
    meilisearch:
        image: 'getmeili/meilisearch:v1.54.1'
        restart: unless-stopped
        environment:
            MEILI_MASTER_KEY: '${MEILISEARCH_KEY}'
            MEILI_NO_ANALYTICS: '${MEILISEARCH_NO_ANALYTICS:-false}'
        volumes:
            - 'sail-meilisearch:/meili_data'
        networks:
            - sail
        healthcheck:
            test: [ "CMD", "wget", "--no-verbose", "--spider",  "http://127.0.0.1:7700/health" ]
            retries: 3
            timeout: 5s
    torznab-adapter:
        build:
            context: ./arr-adapter
        restart: unless-stopped
        environment:
            PORT: 9117
            # `laravel.test` no longer runs a web server; nginx's internal
            # (unpublished) port 8081 serves the app over plain HTTP for
            # trusted container-to-container callers.
            UNIT3D_URL: http://nginx:8081
            UNIT3D_PUBLIC_URL: '${APP_URL}'
        depends_on:
            - nginx
        networks:
            - sail
networks:
    sail:
        driver: bridge
volumes:
    sail-nginx:
        name: '${NGINX_VOLUME:-vltava_sail-nginx}'
        driver: local
    sail-mysql:
        driver: local
    sail-mysql-8-4:
        name: '${MYSQL_VOLUME:-vltava_sail-mysql-8-4}'
        driver: local
    sail-redis:
        name: '${REDIS_VOLUME:-vltava_sail-redis}'
        driver: local
    sail-meilisearch:
        name: '${MEILISEARCH_VOLUME:-vltava_sail-meilisearch}'
        driver: local
