; Overrides the distro default opcache.ini (sury php8.4-fpm package) for the
; FPM SAPI only. validate_timestamps stays on so a redeploy via the bind
; mount is picked up without a manual cache flush, at a small per-request
; mtime-check cost; revalidate_freq amortises that cost.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.save_comments=1
; Sail's debugging extensions override zend_execute_ex(), making JIT unavailable.
opcache.jit=disable
